services:
  - type: web
    name: wastex-broker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wastex.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: DEBUG
        value: "False"
      - key: SITE_ROLE
        value: CLOUD
      - key: SECRET_KEY
        generateValue: true
      # Database (Supabase)
      - key: DATABASE_URL
        sync: false # You will paste your URI here in the Render dashboard
      # Storage (Backblaze B2)
      - key: B2_APPLICATION_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_REGION
        sync: false
